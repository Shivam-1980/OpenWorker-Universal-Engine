<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebGL Red Triangle</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas"></canvas>
    <script>
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl');
        
        if (!gl) {
            alert('WebGL not supported, falling back to canvas.');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            return;
        }

        // Vertex shader source code
        const vsSource = `
            attribute vec4 a_position;
            void main() {
                gl_Position = a_position;
            }
        `;

        // Fragment shader source code
        const fsSource = `
            precision mediump float;
            void main() {
                gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
            }
        `;

        // Create shader objects
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            
            // Check for compilation errors
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                const errorMessage = gl.getShaderInfoLog(shader);
                console.error('Shader compilation failed:', errorMessage);
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        // Create program object
        function createProgram(gl, vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            
            // Check for linking errors
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                const errorMessage = gl.getProgramInfoLog(program);
                console.error('Program linking failed:', errorMessage);
                gl.deleteProgram(program);
                return null;
            }
            return program;
        }

        // Initialize shaders and program
        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = createProgram(gl, vertexShader, fragmentShader);

        if (!program) {
            alert('Failed to create shader program.');
            return;
        }

        // Set up the drawing buffer
        gl.useProgram(program);

        // Create buffer for the triangle
        const vertices = new Float32Array([
            0.0,  0.5,
            -0.5, -0.5,
            0.5, -0.5
        ]);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        // Set up attribute
        const aPositionLocation = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(aPositionLocation);
        gl.vertexAttribPointer(aPositionLocation, 2, gl.FLOAT, false, 0, 0);

        // Clear canvas
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        // Draw the triangle
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
